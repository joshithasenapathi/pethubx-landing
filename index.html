<!DOCTYPE html>
<html>
<head>
<title>PetHubX</title>

<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<nav>
  <h2 class="logo">🐾 PetHubX</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="features.html">Features</a>
    <a href="about.html">About</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>Co-parent your pet,<br><span>effortlessly.</span></h1>
    <p>Track feeding, meds & walks together with family.</p>

    <div class="cta">
      <button class="primary">Join Early Access</button>
      <button class="secondary">See Demo</button>
    </div>
  </div>

  <div class="floating">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" class="pet pet1">
    <img src="https://cdn-icons-png.flaticon.com/512/2138/2138440.png" class="pet pet2">
    <img src="https://cdn-icons-png.flaticon.com/512/616/616430.png" class="pet pet3">
  </div>
</section>

<section class="features">
  <div class="card">🐶 Shared Care</div>
  <div class="card">🔔 Smart Alerts</div>
  <div class="card">📁 Health Records</div>
  <div class="card">👨‍👩‍👧 Family Access</div>
</section>

<img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" id="petFollower">

<footer>
  <p>Made with 🐾 by PetHubX</p>
</footer>

<script>
const pet = document.getElementById("petFollower");

let mouseX = 0;
let mouseY = 0;
let currentX = 0;
let currentY = 0;

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

document.addEventListener("click", () => {
  pet.style.transform = "scale(1.3)";
  setTimeout(() => {
    pet.style.transform = "scale(1)";
  }, 200);
});

function animate() {
  currentX += (mouseX - currentX) * 0.08;
  currentY += (mouseY - currentY) * 0.08;

  pet.style.left = currentX + "px";
  pet.style.top = currentY + "px";

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
